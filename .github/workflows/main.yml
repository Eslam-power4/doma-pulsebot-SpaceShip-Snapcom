name: Enterprise Daily Sniper & State Saver

on:
  workflow_dispatch: # زرار التشغيل اليدوي من الموقع مباشرة مع إمكانية التحكم في الوقت
    inputs:
      custom_timeout:
        description: 'مدة التشغيل بالدقائق (اتركها 20 للوضع السريع أو 115 للوضع العميق)'
        required: false
        default: '20'
  schedule:
    # يعمل الساعة 4:05 الفجر بتوقيت جرينتش (قبل بوت الدوت آب بـ 10 دقائق لمنع التصادم)
    - cron: '05 4 * * *'

# منع تشغيل نسختين في نفس اللحظة حتى لا تتلف قاعدة البيانات
concurrency:
  group: sniper-domain-group
  cancel-in-progress: false

jobs:
  sniper-mission:
    runs-on: ubuntu-latest
    # السيطرة على وقت المهمة بالكامل (20 دقيقة أوتوماتيك، أو حسب اختيارك لو شغلته يدوي)
    timeout-minutes: ${{ fromJSON(inputs.custom_timeout || '20') }}
    permissions:
      contents: write # صلاحية إجبارية لحفظ قاعدة البيانات والشيت والـ VIP

    steps:
    - name: 1. Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: 2. Set up Python 3.12 Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip' # تسريع التسطيب جداً

    - name: 3. Install Mission Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 4. Execute Sniper Bot (Stealth Mode)
      # ضمان استمرار الورك فلو لخطوة الحفظ حتى لو انتهى وقت البوت أو حدث خطأ مفاجئ
      continue-on-error: true
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        SPACESHIP_API_KEY: ${{ secrets.SPACESHIP_API_KEY }}
        SPACESHIP_API_SECRET: ${{ secrets.SPACESHIP_API_SECRET }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        python bot.py

    - name: 5. Save State & Memory for Tomorrow (Force Auto-Commit)
      if: ${{ always() }}
      run: |
        git config --global user.name "Sniper-Bot-Automation"
        git config --global user.email "bot@sniper.local"
        
        # إضافة جميع ملفات الذاكرة والـ Checkpoint ومجلد vip_data الموجود في مشروعك
        git add -f alerts.db processed_domains.csv vip_data/ checkpoint*.json 2>/dev/null || echo "Some optional files not present yet"
        
        # حفظ التغييرات مع عمل Pull تلقائي قبل الـ Push لمنع أي تصادم (Conflict)
        git commit -m "Auto-save: Update daily domain memory state [skip ci]" || echo "No changes to commit"
        git pull --rebase origin main || true
        git push
